version: '3.8'

services:
  floodwatch-backend:
    build:
      context: .
      dockerfile: Dockerfile.s390x
    image: floodwatch-engine:s390x
    container_name: floodwatch-linuxone-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - MODEL_PATH=model.pkl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
